[build]
  publish = "."
  functions = "functions"

  [build.environment]
    NODE_VERSION = "20"

[functions]
  node_bundler = "nft"

[[redirects]]
  from   = "/api/products"
  to     = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from   = "/api/admin/import-products"
  to     = "/.netlify/functions/import-products"
  status = 200

[database]
  [database.migrations]
    path = "database/migrations"
